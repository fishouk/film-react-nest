services:
  postgres:
    image: postgres:16
    container_name: film_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: films
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - film-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d films']
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: film_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '8080:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - film-network

  backend:
    image: ghcr.io/fishouk/film-backend:latest
    container_name: film_backend
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://postgres:5432/films
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      LOGGER_TYPE: json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - film-network

  frontend:
    image: ghcr.io/fishouk/film-frontend:latest
    container_name: film_frontend
    volumes:
      - frontend_dist:/frontend_dist
    networks:
      - film-network

  nginx:
    image: ghcr.io/fishouk/film-nginx:latest
    container_name: film_nginx
    ports:
      - '80:80'
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend
    networks:
      - film-network

volumes:
  pg-data:
  pgadmin-data:
  frontend_dist:

networks:
  film-network:
    driver: bridge
